server {
    listen 443 ssl;
    server_name 18-201-159-229.sslip.io;
    ssl_certificate /etc/letsencrypt/live/18-201-159-229.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18-201-159-229.sslip.io/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
