version: 1
# Hosting: Amazon Amplify auto-builds main (redeploy 2026-08-20 guest-economy + city dressing)
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
